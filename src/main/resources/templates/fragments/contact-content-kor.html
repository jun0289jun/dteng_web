<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
</head>

<body>
	<section>
		<div th:if="${result == 'Success'}">
			<script th:inline="javascript">
				/* Thymeleaf에서 서버에서 전달한 변수를 사용하여 알림 표시 */
				alert('메일 발송 성공');
			</script>
		</div>
		<div th:if="${result == 'Error'}">
			<script th:inline="javascript">
				/* Thymeleaf에서 서버에서 전달한 변수를 사용하여 알림 표시 */
				alert('메일 발송 실패');
			</script>
		</div>
		<div th:if="${result == 'Fail'}">
			<script th:inline="javascript">
				/* Thymeleaf에서 서버에서 전달한 변수를 사용하여 알림 표시 */
				alert('자동 입력 방지코드가 다릅니다');
			</script>
		</div>
		<div id="content-section">
			</br>
			Contact
			<hr class="my-4">
			<div id="box-container">
				<div id="box-left">
					<img th:src="@{/img/contact.png}" alt="contact">
				</div>
				<div id="box-right">
					<p class="title">“고객의 시선에서 함께 하겠습니다.”</p>
					<h3>(주)동탄이엔지는 언제나 고객을 생각합니다.</h3>
					<p class="body-text">대표번호 : (+82) 031-8058-0411 | 주소 : 경기도 화성시 동부대로 814, (방교동, 동탄이엔지)</p>
					<hr>
					<div>
						<form th:action="@{/send-email.do}" method="post">
							<table border="0;" style="width: 100%;">
								<tr>
									<td colspan="3">
										<label for="name">이름 *</label><br>
										<input class="input1" type="text" name="name" placeholder="이름을 입력해 주세요." required><br>
									</td>
								</tr>
								<tr>
									<td>
										<label for="email">이메일 주소 *</label><br>
										<input class="input2" type="text" id="account" name="account" placeholder="이메일 계정을 입력해 주세요." required>
									</td>
									<td>
										<br>
										<input class="input2" type="text" id="domain" name="domain" required>
									</td>
									<td>
										<br>
										<select id="domainDropdown" name="domainDropdown" required>
											<option id="directInputOption" value="directInput">직접입력</option>
											<option value="naver.com">naver.com</option>
											<option value="nate.com">nate.com</option>
											<option value="gmail.com">gmail.com</option>
											<option value="yahoo.com">yahoo.com</option>
											<option value="hanmail.net">hanmail.net</option>
											<!-- 다른 이메일 옵션들 추가 -->
						
											<!-- 직접입력 옵션 -->
						
										</select>
									</td>
								</tr>
								<tr>
									<td>
										<label for="contact">연락처 *</label><br>
										<input class="input2" type="number" id="contact" name="contact1" required />
									</td>
									<td>
										<br>
										<input class="input2" type="number" id="contact" name="contact2" required />
									</td>
									<td>
										<br>
										<input class="input1" type="number" id="contact" name="contact3" required />
									</td>
								</tr>
							</table>
							<br>
							<br>
						
							<label for="message">문의내용 *</label><br>
							<textarea id="message" name="message" rows="15" cols="50" placeholder="문의내용을 입력해 주세요.
																													&#10;
																													&#10;[개인정보 수집 및 이용동의 안내]
																													&#10; 동탄이엔지에에 문의하기 진행을 위해 아래와 같이 개인정보를 수집 및 이용에 동의해주시기 바랍니다.
																													&#10; *수집항목 - 이름, 이메일, 연락처
																													&#10; - 이름, 이메일, 연락처는 필수 수집항목으로 꼭 입력해 주셔야 합니다.
																													&#10; *이용목적 - 문의하기 답변 및 홍보자료 제공
																													&#10; - 문의하기 외 목적으로 사용하지 않습니다.
																													&#10; *이용/보관기간 - 고객은 동의를 거부할 수 있으며 동의 거부 시에는 문의하기 서비스 이용이 불가합니다.
																													&#10; - 수집한 개인정보는 고객이 파기 요청이 있을 때 까지 보관하면 파기 요청 시 즉시 파기합니다.
																													" required></textarea><br>
							<input type="checkbox" id="subscribe" name="subscribe" required /> 개인정보 수집 및 이용에
							동의합니다.<br><br>
						
						
							<!-- 네이버 캡차 영역 -->
							<label for="captcha" style="display:block">자동 입력 방지코드*</label>
							<div id="captcha-container">
								<div id="captcha-img" style="text-align: center; background-color: #DDDDDD;">
									<iframe th:src="@{/captcha-image-load-kor.do}" width="300px" , height=170px>
										<p>사용 중인 브라우저는 iframe을 지원하지 않습니다.</p>
									</iframe>
								</div>
								<div id="captcha-code">
									<input class="input1" type="text" id="user_value" name="user_value" placeholder="자동 입력 방지 코드를 입력해 주세요."
										style="display:block" required />
								</div>
							</div>
						
							<hr>
							<input type="hidden" name="lang" value="kor">
							<input id="select-button" type="submit" value="보내기">
						</div>
					</form>
				</div>
			</div>
		</div>
	</section>
</body>

</html>
